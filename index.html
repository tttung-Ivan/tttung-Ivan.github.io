<style>
:root{--glass:rgba(15,12,35,.48);--line:rgba(255,255,255,.17)}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{color:#fff;overflow-x:hidden;background:#080513}
.cosmos{position:fixed;inset:-8%;z-index:-3;overflow:hidden;background:
radial-gradient(ellipse at 18% 20%,rgba(73,60,210,.78),transparent 31%),
radial-gradient(ellipse at 76% 28%,rgba(214,63,188,.48),transparent 28%),
radial-gradient(ellipse at 60% 76%,rgba(35,135,220,.55),transparent 34%),
radial-gradient(ellipse at 30% 80%,rgba(119,40,180,.42),transparent 30%),
linear-gradient(135deg,#05020d 0%,#13062d 42%,#06142e 72%,#02030b 100%);
animation:cosmicDrift 20s ease-in-out infinite alternate;transform:scale(1.08)}
.cosmos:before,.cosmos:after{content:"";position:absolute;inset:0}
.cosmos:before{background-image:
radial-gradient(circle at 10% 20%,#fff 0 1px,transparent 1.7px),
radial-gradient(circle at 30% 70%,#fff 0 1.2px,transparent 1.8px),
radial-gradient(circle at 55% 18%,#fff 0 1px,transparent 1.6px),
radial-gradient(circle at 75% 62%,#fff 0 1.3px,transparent 1.9px),
radial-gradient(circle at 90% 35%,#fff 0 1px,transparent 1.7px);
background-size:110px 120px,170px 160px,145px 135px,190px 175px,130px 155px;
opacity:.75;animation:stars 28s linear infinite}
.cosmos:after{inset:12% 8%;filter:blur(45px);opacity:.75;background:
conic-gradient(from 210deg at 48% 48%,transparent 0 15%,rgba(126,79,255,.38) 24%,rgba(255,90,207,.25) 31%,transparent 43% 62%,rgba(50,168,255,.3) 73%,transparent 85%);
border-radius:50%;animation:nebula 18s ease-in-out infinite alternate}
@keyframes cosmicDrift{to{transform:scale(1.14) translate3d(-2%,1.5%,0)}}
@keyframes stars{to{transform:translate3d(-35px,25px,0)}}
@keyframes nebula{to{transform:rotate(9deg) scale(1.12);opacity:.95}}
.wrap{width:min(100%,540px);margin:auto;padding:36px 16px 52px}
.profile{text-align:center;margin-bottom:28px}
.avatar-shell{width:154px;height:154px;margin:0 auto 18px;padding:3px;border-radius:50%;background:linear-gradient(135deg,#75d7ff,#b57aff,#ff78cb);box-shadow:0 0 45px rgba(129,93,255,.45)}
.avatar{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;border:3px solid rgba(8,5,19,.8)}
h1{margin:0;font-size:clamp(31px,8vw,46px);line-height:.95;letter-spacing:-.045em;text-transform:uppercase;text-shadow:0 3px 30px rgba(0,0,0,.45)}
.sub{margin:10px 0 0;font-size:12px;letter-spacing:.24em;color:rgba(255,255,255,.68);text-transform:uppercase}
.links{display:grid;gap:12px}
.link{position:relative;display:flex;align-items:center;gap:14px;padding:13px 16px;min-height:70px;border-radius:20px;text-decoration:none;color:#fff;background:var(--glass);border:1px solid var(--line);box-shadow:0 12px 35px rgba(0,0,0,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:.22s ease;overflow:hidden}
.link:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent,rgba(255,255,255,.08),transparent);transform:translateX(-110%);transition:.45s}
.link:hover{transform:translateY(-3px) scale(1.01);background:rgba(26,19,58,.62);border-color:rgba(255,255,255,.3)}
.link:hover:before{transform:translateX(110%)}
.iconbox{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.96);display:grid;place-items:center;flex:0 0 44px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.iconbox img{width:27px;height:27px;object-fit:contain}
.icon-text{font-size:21px;color:#17131e;font-weight:800}
.copy{min-width:0;flex:1}.label{display:block;font-size:15px;font-weight:750}.value{display:block;margin-top:3px;color:rgba(255,255,255,.62);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{font-size:20px;color:rgba(255,255,255,.5)}
footer{text-align:center;margin-top:24px;color:rgba(255,255,255,.4);font-size:10px;letter-spacing:.14em}
@media(prefers-reduced-motion:reduce){.cosmos,.cosmos:before,.cosmos:after{animation:none}}
</style>
